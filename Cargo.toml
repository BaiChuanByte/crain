[package]
name = "crain"
version = "0.1.0"
edition = "2024"
authors = ["BaiChuanByte <baichuanbyte@outlook.com>"]

description = "A Brainfuck compiler/interpreter/tool"

documentation = "https://docs.rs/crain"
repository = "https://github.com/BaichuanByte/crain"
readme = "README.md"

keywords = ["brainfuck", "esolang", "compiler", "interpreter"]
categories = ["compilers", "parser-implementations"]

license = "MIT"

[features]
bin = ["clap", "enum_convert"]

[dependencies]
smart-default = "0.7"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"], optional = true }
enum_convert = { version = "0.2.0", optional = true }

[lib]
name = "crain"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "crain"
path = "src/main.rs"
required-features = ["bin"]
